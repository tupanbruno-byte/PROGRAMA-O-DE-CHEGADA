<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONTROL TOWER &gt; CHEGADAS PREVISTAS NO PORTO DE SUAPE</title>
<meta name="description" content="CONTROL TOWER &gt; CHEGADAS PREVISTAS NO PORTO DE SUAPE — monitoramento de operações marítimas, atracações e containers. Port of Suape | Brazil.">
<meta name="application-name" content="CONTROL TOWER &gt; CHEGADAS PREVISTAS NO PORTO DE SUAPE">
<meta name="theme-color" content="#0A0B0C">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="CONTROL TOWER &gt; CHEGADAS PREVISTAS NO PORTO DE SUAPE">
<meta property="og:description" content="Central de monitoramento de operações marítimas — Port of Suape | Brazil.">
<meta name="twitter:title" content="CONTROL TOWER &gt; CHEGADAS PREVISTAS NO PORTO DE SUAPE">
<style>
:root{
  --bg:#0A0B0C;
  --tx:#E9ECEF;
  --mt:#7D858F;
  --dim:#4B525B;
  --live:#2FBF71;
  --warn:#E5B143;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;background:var(--bg);font-size:clamp(12px,.5vw + 8px,22px)}
body{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;color:var(--tx);background:var(--bg);
  font-family:"SF Pro Display",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

/* ---------- fundo ---------- */
.bg{position:fixed;inset:-25%;z-index:0;pointer-events:none;
  background:
   radial-gradient(48% 42% at 78% 12%,rgba(26,92,190,.15),transparent 70%),
   radial-gradient(44% 40% at 10% 96%,rgba(32,160,104,.08),transparent 70%),
   radial-gradient(70% 60% at 50% 50%,rgba(255,255,255,.012),transparent 75%);
  animation:drift 48s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{from{transform:translate3d(-1.2%,-.8%,0) scale(1)}to{transform:translate3d(1.4%,1%,0) scale(1.03)}}

/* ---------- cabeçalho ---------- */
header{position:relative;z-index:2;flex:none;height:2.9rem;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;
  padding:0 clamp(.9rem,1.4vw,1.6rem);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.ttl{font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis}
.ttl i{font-style:normal;color:var(--dim);margin:0 .55em}
.sync{display:flex;align-items:center;gap:1.4rem;color:var(--mt);letter-spacing:.06em;text-transform:none;font-size:.74rem;font-variant-numeric:tabular-nums}
.live{display:flex;align-items:center;gap:.5rem;color:var(--tx);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:.68rem}
.dot{width:.46rem;height:.46rem;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(47,191,113,.5);animation:pulse 2.8s ease-out infinite;transition:background .6s}
body.retry .dot{background:var(--warn);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.45)}70%,100%{box-shadow:0 0 0 .5rem rgba(47,191,113,0)}}
.sync b{font-weight:500;color:var(--tx)}
#st{transition:opacity .5s}

/* ---------- palco do relatório ---------- */
.stage{position:relative;z-index:1;flex:1;min-height:0;margin:0 clamp(.5rem,1vw,1.25rem);border-radius:.9rem;overflow:hidden;background:#0D0F11;
  box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 60px -28px rgba(0,0,0,.9);
  opacity:0;animation:fadein 1.1s var(--ease) 1.6s forwards}
@keyframes fadein{to{opacity:1}}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0D0F11;opacity:0;transition:opacity .8s var(--ease)}
.stage iframe.on{opacity:1}
.prog{position:absolute;left:0;top:0;height:2px;width:100%;z-index:3;overflow:hidden;opacity:0;transition:opacity .5s;pointer-events:none}
.prog::after{content:"";position:absolute;top:0;left:-40%;height:100%;width:40%;background:linear-gradient(90deg,transparent,rgba(120,170,255,.7),transparent);animation:slide 1.6s ease-in-out infinite}
body.loading .prog{opacity:1}
@keyframes slide{to{left:100%}}

/* ---------- relógios ---------- */
footer{position:relative;z-index:2;flex:none;height:2.3rem;display:flex;align-items:center;justify-content:flex-end;gap:1.6rem;
  padding:0 clamp(.9rem,1.4vw,1.6rem);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden}
.clk{display:flex;align-items:baseline;gap:.5rem}
.clk b{font-weight:500;color:var(--mt);letter-spacing:.08em;font-variant-numeric:tabular-nums}

/* ---------- abertura ---------- */
#intro{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;
  transition:opacity .9s var(--ease),visibility .9s}
#intro.out{opacity:0;visibility:hidden}
#intro .in{display:flex;flex-direction:column;align-items:center;gap:1.1rem;padding:0 1.5rem}
#intro .a{font-size:clamp(1.6rem,3.6vw,3.4rem);font-weight:300;letter-spacing:.42em;text-indent:.42em;color:var(--tx)}
#intro .ln{width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:grow 1.4s var(--ease) .35s forwards}
#intro .b{font-size:clamp(.7rem,1.1vw,1.1rem);font-weight:500;letter-spacing:.3em;text-indent:.3em;color:var(--mt)}
#intro .c{font-size:clamp(.6rem,.85vw,.85rem);letter-spacing:.34em;text-indent:.34em;color:var(--dim)}
#intro .d{margin-top:1.6rem;font-size:clamp(.65rem,.9vw,.9rem);letter-spacing:.08em;color:var(--dim);animation:breathe 2s ease-in-out infinite}
#intro .a,#intro .b,#intro .c,#intro .d{opacity:0;animation-fill-mode:forwards}
#intro .a{animation:rise 1s var(--ease) .1s forwards}
#intro .b{animation:rise 1s var(--ease) .5s forwards}
#intro .c{animation:rise 1s var(--ease) .75s forwards}
#intro .d{animation:rise 1s var(--ease) 1s forwards,breathe 2s ease-in-out 2s infinite}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{to{width:min(52vw,460px)}}
@keyframes breathe{50%{opacity:.45}}

/* ---------- responsivo ---------- */
@media(max-width:1000px){.sync .opt{display:none}.sync{gap:1rem}}
@media(max-width:640px){.sync .opt2{display:none}header{font-size:.62rem}footer{gap:.9rem;justify-content:space-between}}
@media(min-width:2400px){header{height:3.1rem}footer{height:2.5rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.stage{opacity:1}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<div id="intro" role="status" aria-live="polite">
  <div class="in">
    <div class="a">CONTROL TOWER</div>
    <div class="ln"></div>
    <div class="b">CHEGADAS PREVISTAS NO PORTO DE SUAPE</div>
    <div class="c">PORT OF SUAPE | BRAZIL</div>
    <div class="d">Sincronizando operações marítimas...</div>
  </div>
</div>

<header>
  <div class="ttl">CONTROL TOWER<i>&gt;</i>CHEGADAS PREVISTAS NO PORTO DE SUAPE</div>
  <div class="sync">
    <span class="live"><span class="dot"></span>LIVE</span>
    <span id="st" class="opt2">Dados sincronizados</span>
    <span class="opt">Última sincronização: <b id="last">--:--</b></span>
    <span class="opt">Próxima atualização automática: <b id="next">5 min</b></span>
  </div>
</header>

<div class="stage" id="stage"><div class="prog"></div></div>

<footer id="clocks" aria-label="Horários globais"></footer>

<script>
(function(){
  "use strict";
  var LOOKER_URL="https://datastudio.google.com/embed/reporting/48f5d941-3946-41f4-9efa-fd201118004d/page/wTvBG";
  var REFRESH_MS=5*60*1000;   /* atualização automática do iframe */
  var RETRY_MS=30*1000;       /* nova tentativa se o carregamento falhar */
  var LOAD_TIMEOUT=30*1000;
  var INTRO_MS=2000;

  var $=function(id){return document.getElementById(id)};
  var stage=$("stage"),current=null,busy=false,nextAt=Infinity,first=true;
  var pad=function(n){return n<10?"0"+n:""+n};
  var hm=function(d){return pad(d.getHours())+":"+pad(d.getMinutes())};

  /* ---------- abertura ---------- */
  setTimeout(function(){
    var i=$("intro");i.classList.add("out");
    setTimeout(function(){i.style.display="none"},1000);
  },INTRO_MS);

  /* ---------- sincronização do relatório (apenas o iframe) ---------- */
  function setState(mode){
    document.body.classList.toggle("retry",mode==="retry");
    $("st").textContent=mode==="retry"?"Reconectando...":mode==="sync"?"Sincronizando...":"Dados sincronizados";
  }

  function build(){
    var f=document.createElement("iframe");
    f.title="CONTROL TOWER > CHEGADAS PREVISTAS NO PORTO DE SUAPE";
    f.setAttribute("allowfullscreen","");
    f.setAttribute("sandbox","allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups");
    f.src=LOOKER_URL;
    return f;
  }

  function finish(ok){
    busy=false;
    document.body.classList.remove("loading");
    if(ok){
      $("last").textContent=hm(new Date());
      nextAt=Date.now()+REFRESH_MS;
      setState("ok");
    }else{
      nextAt=Date.now()+RETRY_MS;
      setState("retry");
    }
    tick();
  }

  function sync(){
    if(busy)return;
    busy=true;
    document.body.classList.add("loading");
    setState("sync");
    var f=build(),done=false;
    stage.appendChild(f);   /* novo iframe carrega por cima; o antigo permanece visível até o swap */
    var guard=setTimeout(function(){
      if(done)return;done=true;f.remove();finish(false);
    },LOAD_TIMEOUT);
    f.addEventListener("load",function(){
      if(done)return;
      /* pequena espera para o Looker renderizar antes de revelar (evita flicker) */
      setTimeout(function(){
        if(done)return;done=true;clearTimeout(guard);
        requestAnimationFrame(function(){f.classList.add("on")});
        var old=current;current=f;
        if(old)setTimeout(function(){old.remove()},1000);
        first=false;finish(true);
      },first?500:2500);
    },{once:true});
  }

  /* ---------- relógio interno (contagem + atualização) ---------- */
  function tick(){
    var rem=nextAt-Date.now();
    if(isFinite(nextAt)){
      $("next").textContent=Math.max(1,Math.ceil(rem/60000))+" min";
      if(!busy&&rem<=0)sync();
    }
  }
  setInterval(tick,1000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});

  /* ---------- relógios globais ---------- */
  var zones=[["RECIFE","America/Recife"],["SHANGHAI","Asia/Shanghai"],["NINGBO","Asia/Shanghai"],["QINGDAO","Asia/Shanghai"],["SINGAPORE","Asia/Singapore"]];
  var wrap=$("clocks"),fmts=[],els=[];
  zones.forEach(function(z){
    var d=document.createElement("div");d.className="clk";
    d.innerHTML="<span>"+z[0]+"</span><b>--:--</b>";
    wrap.appendChild(d);els.push(d.lastChild);
    try{fmts.push(new Intl.DateTimeFormat("pt-BR",{timeZone:z[1],hour:"2-digit",minute:"2-digit",hour12:false}))}
    catch(e){fmts.push(null)}
  });
  function clocks(){
    var now=new Date();
    for(var i=0;i<els.length;i++){els[i].textContent=fmts[i]?fmts[i].format(now):"--:--"}
  }
  clocks();setInterval(clocks,1000);

  sync();
})();
</script>
</body>
</html>
